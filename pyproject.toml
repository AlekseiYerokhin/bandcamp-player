[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandcamp-player"
version = "0.1.0"
description = "Bandcamp Player built with Qt6 and VLC"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "python-vlc",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyinstaller",
]

[project.scripts]
bandcamp-player = "main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
