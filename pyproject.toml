[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandcamp-player"
version = "0.1.0"
description = "Bandcamp Player built with Qt6 and VLC"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.1",
    "python-vlc==3.0.21203",
    "dbus-next==0.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-qt==4.5.0",
    "ruff==0.16.7",
    "pyinstaller==6.22.2",
]

[project.scripts]
bandcamp-player = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bandcamp_player*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
