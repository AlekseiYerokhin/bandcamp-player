[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bandcamp-qt-player"
version = "0.1.0"
description = "Bandcamp Player built with Qt6 and VLC"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "python-vlc",
    "requests",
]

[project.scripts]
bandcamp-qt = "main:main"
